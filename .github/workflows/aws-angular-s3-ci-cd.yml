name: Reusable AWS Angular (S3 + CloudFront) CI/CD

# Reutilizable: prueba una app Angular con SonarCloud y la publica como sitio
# estático en Amazon S3, invalidando la caché de CloudFront. Autenticación con
# AWS vía OIDC (rol IAM temporal, sin claves de larga vida).

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Nombre legible del servicio'
        required: true
        type: string
      sonar-project-key:
        description: 'Project key de SonarCloud'
        required: true
        type: string
      node-version:
        description: 'Versión de Node.js'
        required: false
        type: string
        default: '22'
      api-url:
        description: 'URL pública de la API (se inyecta en el build de producción)'
        required: true
        type: string
      aws-region:
        description: 'Región de AWS'
        required: false
        type: string
        default: 'us-east-1'
      s3-bucket:
        description: 'Bucket S3 destino del sitio estático'
        required: true
        type: string
      cloudfront-distribution-id:
        description: 'ID de la distribución de CloudFront a invalidar (opcional)'
        required: false
        type: string
        default: ''
      dist-path:
        description: 'Carpeta de salida del build a subir a S3'
        required: false
        type: string
        default: 'dist/code-insight-ai-web/browser'
      env-prod-file:
        description: 'Archivo de environment de producción donde se inyecta api-url'
        required: false
        type: string
        default: 'src/environments/environment.prod.ts'
    secrets:
      SONAR_TOKEN:
        required: true
      AWS_ROLE_ARN:
        description: 'ARN del rol IAM que GitHub asume vía OIDC'
        required: true

permissions:
  id-token: write   # requerido para OIDC
  contents: read

jobs:
  analyze:
    name: Build, Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simular merge del PR en main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "🧩 Simulando merge del PR con main para ${{ inputs.service-name }}..."
          git config --global user.email "ci@github.com"
          git config --global user.name "CI Bot"
          git fetch origin main
          git checkout -b simulated-main origin/main
          git fetch origin ${{ github.head_ref }}
          git merge --no-commit --no-ff origin/${{ github.head_ref }} || true

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Build project
        run: npm run build -- --configuration production

      - name: SonarCloud Scan & Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject API URL into production environment
        run: |
          echo "🔧 Inyectando API URL en ${{ inputs.env-prod-file }}"
          sed -i "s|__API_URL__|${{ inputs.api-url }}|g" "${{ inputs.env-prod-file }}"

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync bundle to S3
        run: |
          echo "🚀 Subiendo ${{ inputs.dist-path }} a s3://${{ inputs.s3-bucket }}"
          aws s3 sync "${{ inputs.dist-path }}" "s3://${{ inputs.s3-bucket }}" --delete

      - name: Invalidate CloudFront cache
        if: inputs.cloudfront-distribution-id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront-distribution-id }}" \
            --paths "/*"

      - name: Deploy summary
        run: echo "✅ ${{ inputs.service-name }} publicado en s3://${{ inputs.s3-bucket }}."
