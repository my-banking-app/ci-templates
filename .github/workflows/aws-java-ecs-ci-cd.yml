name: Reusable AWS Java (ECS Fargate) CI/CD

# Reutilizable: prueba una API Java/Spring Boot con SonarCloud y la despliega en
# Amazon ECS Fargate (imagen en Amazon ECR). Autenticación con AWS vía OIDC
# (rol IAM temporal, sin claves de larga vida).

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Nombre legible del servicio'
        required: true
        type: string
      ecr-repository:
        description: 'Nombre del repositorio en Amazon ECR'
        required: true
        type: string
      ecs-cluster:
        description: 'Nombre del cluster de ECS'
        required: true
        type: string
      ecs-service:
        description: 'Nombre del servicio de ECS'
        required: true
        type: string
      ecs-task-definition:
        description: 'Ruta del task-definition.json dentro del repo'
        required: false
        type: string
        default: 'task-definition.json'
      container-name:
        description: 'Nombre del contenedor dentro del task definition'
        required: true
        type: string
      aws-region:
        description: 'Región de AWS'
        required: false
        type: string
        default: 'us-east-1'
      java-version:
        description: 'Versión de Java'
        required: false
        type: string
        default: '21'
      sonar-project-key:
        description: 'Project key de SonarCloud'
        required: true
        type: string
      maven-command:
        description: 'Comando Maven para compilar y probar'
        required: false
        type: string
        default: 'mvn -B clean verify'
      frontend-config-s3-bucket:
        description: 'Si se indica, tras el deploy escribe config.json (con la URL pública actual) en este bucket S3 del frontend'
        required: false
        type: string
        default: ''
      api-port:
        description: 'Puerto público del API (para construir la URL en config.json)'
        required: false
        type: string
        default: '8080'
    secrets:
      SONAR_TOKEN:
        required: true
      AWS_ROLE_ARN:
        description: 'ARN del rol IAM que GitHub asume vía OIDC'
        required: true
      DB_PASSWORD:
        description: 'Contraseña de la BD; se inyecta como env var en el task definition al desplegar'
        required: false
      OPENAI_API_KEY:
        description: 'API key de OpenAI (opcional); se inyecta como env var en el task definition. Sin ella, la app cae al modo heurístico'
        required: false
      GITHUB_TOKEN_FOR_ANALYSIS:
        description: 'Token de GitHub (opcional) para subir el límite de la API pública usada en el análisis (60 -> 5000 req/hora)'
        required: false

permissions:
  id-token: write   # requerido para OIDC
  contents: read

jobs:
  analyze:
    name: Build, Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simular merge del PR en main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "🧩 Simulando merge del PR con main para ${{ inputs.service-name }}..."
          git config --global user.email "ci@github.com"
          git config --global user.name "CI Bot"
          git fetch origin main
          git checkout -b simulated-main origin/main
          git fetch origin ${{ github.head_ref }}
          git merge --no-commit --no-ff origin/${{ github.head_ref }} || true

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & test with Maven (genera Jacoco)
        run: ${{ inputs.maven-command }}

      - name: SonarCloud Scan & Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🐳 Building ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ inputs.ecs-task-definition }}
          container-name: ${{ inputs.container-name }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN_FOR_ANALYSIS }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.ecs-service }}
          cluster: ${{ inputs.ecs-cluster }}
          wait-for-service-stability: true

      - name: Publish runtime config.json to frontend bucket
        if: inputs.frontend-config-s3-bucket != ''
        env:
          CLUSTER: ${{ inputs.ecs-cluster }}
          SERVICE: ${{ inputs.ecs-service }}
          BUCKET: ${{ inputs.frontend-config-s3-bucket }}
          PORT: ${{ inputs.api-port }}
        run: |
          echo "🔎 Obteniendo IP pública de la tarea en ejecución..."
          for i in $(seq 1 20); do
            TASK=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status RUNNING --query 'taskArns[0]' --output text)
            if [ "$TASK" != "None" ] && [ -n "$TASK" ]; then
              ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
              IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
                --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
              if [ -n "$IP" ] && [ "$IP" != "None" ]; then break; fi
            fi
            echo "  esperando tarea RUNNING con IP... ($i)"; sleep 15
          done
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "❌ No se pudo obtener la IP pública de la tarea"; exit 1
          fi
          echo "{\"apiUrl\":\"http://$IP:$PORT\"}" > config.json
          echo "📝 config.json => $(cat config.json)"
          aws s3 cp config.json "s3://$BUCKET/config.json" \
            --cache-control "no-cache" --content-type "application/json"
          echo "✅ config.json publicado en s3://$BUCKET/config.json"

      - name: Deploy summary
        run: echo "✅ ${{ inputs.service-name }} desplegado en ECS (${{ inputs.ecs-cluster }}/${{ inputs.ecs-service }})."
